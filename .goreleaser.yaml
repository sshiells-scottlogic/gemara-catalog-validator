# GoReleaser config — produces versioned, cross-platform binaries on tag push.
# Validate locally with: goreleaser check
version: 2

project_name: gemara-validate

before:
  hooks:
    - go mod tidy

builds:
  - id: gemara-validate
    main: .
    binary: gemara-validate
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [gemara-validate]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: sshiells-scottlogic
    name: gemara-catalog-validator
